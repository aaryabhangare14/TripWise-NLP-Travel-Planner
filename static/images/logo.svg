<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="twLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff782e"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="twWingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="twGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Rounded Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#twLogoGrad)" filter="url(#twGlow)"/>
  <!-- Route Loop / Compass Arc -->
  <path d="M16,46 C16,46 22,22 46,18" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3,3"/>
  <!-- Modern Supersonic Jet / Travel Plane -->
  <polygon points="48,16 18,31 29,36 34,47 38,39 48,16" fill="url(#twWingGrad)"/>
  <polygon points="48,16 29,36 38,39" fill="#fed7aa" opacity="0.9"/>
  <!-- Sparkle / Destination Pin -->
  <circle cx="48" cy="16" r="3" fill="#ffffff"/>
  <circle cx="16" cy="46" r="2.5" fill="#fef08a"/>
</svg>
